<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MindScape — an AI learning platform: study from your PDFs with StudyMate AI, practise in the Coding Arena, and learn together in live meetings." />
    <meta name="theme-color" content="#07080d" />
    <title>MindScape — Learn, build and grow with AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>MindScape needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
